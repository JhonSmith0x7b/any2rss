<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="app-base" content="__APP_BASE__"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · ANY2RSS</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#171717;color:#d4d4d4;font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:100%;max-width:380px}h1{color:#ffff80;text-align:center;font-size:34px;margin-bottom:8px}p{color:#a3a3a3;text-align:center;margin-bottom:36px}label{display:block;margin:18px 0 8px}input,button{font:inherit;width:100%;padding:12px;border:1px solid #444;border-radius:3px}input{background:#202020;color:#eee}input:focus{outline:2px solid #ffff80;outline-offset:2px}button{background:#ffff80;color:#171717;cursor:pointer;margin-top:26px;font-weight:bold}button:disabled{opacity:.5;cursor:wait}#error{color:#ffaaa0;margin-top:18px;min-height:24px;text-align:left}
</style><main><h1>ANY2RSS</h1><p>登录后管理你的订阅</p><form id="login"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required maxlength="256" autofocus><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"><button id="submit">登录</button><div id="error" role="alert"></div></form></main><script>
const APP_BASE=document.querySelector('meta[name="app-base"]').content;
document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const button=document.querySelector('#submit'),error=document.querySelector('#error');button.disabled=true;error.textContent='';try{const response=await fetch(APP_BASE+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});if(response.ok){location.assign(APP_BASE+'/');return}error.textContent=response.status===429?'尝试次数过多，请 5 分钟后重试。':response.status===401?'用户名或密码错误。':'登录失败，请稍后重试。'}catch{error.textContent='无法连接服务，请稍后重试。'}finally{button.disabled=false}});
</script></html>
